<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 540" width="1280" height="540" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Respaldo distribuido en varios R2"><title>Respaldo distribuido en varios R2</title><defs><marker id="m-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="m-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="m-c74634" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c74634"/></marker><marker id="m-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="m-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m-f38020" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f38020"/></marker><marker id="m-4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker></defs><rect width="1280" height="540" rx="16" fill="#f8fafc" stroke="#d1d5db"/><text x="30" y="40" font-size="20" font-weight="700" fill="#1f2937">Respaldo distribuido en N buckets R2</text><text x="30" y="62" font-size="13" fill="#6b7280">El respaldo completo se sube a TODOS los R2 de la lista; cada uno lleva su propia reserva y su _hecho.json.</text><g class="caja" data-t="Oracle ADB"><rect x="30" y="130" width="230" height="150" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/><rect x="30" y="130" width="230" height="6" rx="3" fill="#c74634"/><text x="44" y="158" font-size="15" font-weight="700" fill="#c74634">Oracle ADB</text><text x="44" y="180" font-size="12.5" fill="#1f2937">esquema(s) del proyecto</text><text x="44" y="199" font-size="12.5" fill="#1f2937"></text><text x="44" y="218" font-size="12.5" fill="#1f2937">solo SELECT (READ ONLY)</text></g><g class="caja" data-t="Nodo"><rect x="330" y="130" width="300" height="190" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="330" y="130" width="300" height="6" rx="3" fill="#4f46e5"/><text x="344" y="158" font-size="15" font-weight="700" fill="#4f46e5">Nodo</text><text x="344" y="180" font-size="12.5" fill="#1f2937">pbdbbackup.py --subir --una-por-dia</text><text x="344" y="199" font-size="12.5" fill="#1f2937"></text><text x="344" y="218" font-size="12.5" fill="#1f2937">1. extrae de la BD, o BAJA de un R2</text><text x="344" y="237" font-size="12.5" fill="#1f2937">2. deja la copia local</text><text x="344" y="256" font-size="12.5" fill="#1f2937">3. sube a cada R2 pendiente</text><text x="344" y="275" font-size="12.5" fill="#1f2937">4. _hecho.json en cada R2</text></g><g class="caja" data-t="Copia local"><rect x="330" y="390" width="300" height="84" rx="10" fill="#fff" stroke="#0f766e" stroke-width="2"/><rect x="330" y="390" width="300" height="6" rx="3" fill="#0f766e"/><text x="344" y="418" font-size="15" font-weight="700" fill="#0f766e">Copia local</text><text x="344" y="440" font-size="12.5" fill="#1f2937">respaldos/  ·  rotacion --retener N</text></g><g class="caja" data-t="R2 #1"><rect x="860" y="90" width="390" height="118" rx="10" fill="#fff" stroke="#f38020" stroke-width="2"/><rect x="860" y="90" width="390" height="6" rx="3" fill="#f38020"/><text x="874" y="118" font-size="15" font-weight="700" fill="#f38020">R2 #1</text><text x="874" y="140" font-size="12.5" fill="#1f2937">cuenta A  ·  bucket pbdb-respaldos-a</text><text x="874" y="159" font-size="12.5" fill="#1f2937">proyecto/AAAA-MM-DD/  ·  _reserva.json</text></g><text data-l="e1" style="opacity:0" x="874" y="190" font-size="12.5" font-weight="700" fill="#15803d">_hecho.json: respaldo completo</text><g class="caja" data-t="R2 #2"><rect x="860" y="230" width="390" height="118" rx="10" fill="#fff" stroke="#f38020" stroke-width="2"/><rect x="860" y="230" width="390" height="6" rx="3" fill="#f38020"/><text x="874" y="258" font-size="15" font-weight="700" fill="#f38020">R2 #2</text><text x="874" y="280" font-size="12.5" fill="#1f2937">cuenta B  ·  bucket pbdb-respaldos-b</text><text x="874" y="299" font-size="12.5" fill="#1f2937">proyecto/AAAA-MM-DD/  ·  _reserva.json</text></g><text data-l="e2" style="opacity:0" x="874" y="330" font-size="12.5" font-weight="700" fill="#15803d">_hecho.json: respaldo completo</text><g id="r3" style="opacity:.4"><g class="caja" data-t="R2 #3"><rect x="860" y="370" width="390" height="118" rx="10" fill="#fff" stroke="#f38020" stroke-width="2"/><rect x="860" y="370" width="390" height="6" rx="3" fill="#f38020"/><text x="874" y="398" font-size="15" font-weight="700" fill="#f38020">R2 #3</text><text x="874" y="420" font-size="12.5" fill="#1f2937">cuenta C  ·  bucket pbdb-respaldos-c</text><text x="874" y="439" font-size="12.5" fill="#1f2937">proyecto/AAAA-MM-DD/  ·  _reserva.json</text></g><text data-l="e3" style="opacity:0" x="874" y="470" font-size="12.5" font-weight="700" fill="#15803d">_hecho.json: respaldo completo</text></g><text x="1050" y="510" font-size="11.5" fill="#6b7280" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">R2 #3: se agrega al .env despues (caso de vm-b)</text><path id="d-db" d="M260,205 L328,205" fill="none" stroke="#c74634" stroke-width="2" marker-end="url(#m-c74634)"/><text x="294" y="196" font-size="11.5" fill="#6b7280" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">filas</text><path id="d-loc" d="M480,320 L480,388" fill="none" stroke="#0f766e" stroke-width="2" marker-end="url(#m-0f766e)"/><path id="d-up1" d="M630,190 C750,190 760,149 858,149" fill="none" stroke="#f38020" stroke-width="2" marker-end="url(#m-f38020)"/><path id="d-up2" d="M630,225 C750,225 760,289 858,289" fill="none" stroke="#f38020" stroke-width="2" marker-end="url(#m-f38020)"/><path id="d-up3" d="M630,260 C750,280 760,429 858,429" fill="none" stroke="#f38020" stroke-width="2" marker-end="url(#m-f38020)"/><text x="745" y="176" font-size="11.5" fill="#6b7280" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">sube</text><path id="d-baja" d="M858,120 C760,92 640,96 560,128" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m-7c3aed)"/><text x="720" y="84" font-size="11.5" fill="#7c3aed" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">baja si algun R2 ya tiene el dia (sin tocar la BD)</text><g opacity="0"><circle r="6" fill="#c74634" stroke="#fff" stroke-width="2"/><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#d-db"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="1.6s" begin="0s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#f38020" stroke="#fff" stroke-width="2"/><text font-size="10" font-weight="700" fill="#f38020" x="9" y="-8">zip</text><animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#d-up1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#f38020" stroke="#fff" stroke-width="2"/><text font-size="10" font-weight="700" fill="#f38020" x="9" y="-8">zip</text><animateMotion dur="1.8s" begin="1.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#d-up2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="1.8s" begin="1.0s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#f38020" stroke="#fff" stroke-width="2"/><animateMotion dur="1.8s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#d-up3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="1.8s" begin="1.4s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#7c3aed" stroke="#fff" stroke-width="2"/><text font-size="10" font-weight="700" fill="#7c3aed" x="9" y="-8">zip</text><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#d-baja"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></g><text x="30" y="520" font-size="12" fill="#6b7280">R2_ACCOUNT_ID=idA,idB,idC · R2_BUCKET=a,b,c · cada variable admite una lista; un valor unico se usa en todos.</text></svg>
