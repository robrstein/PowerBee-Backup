-weight="700" fill="#1f2937">Topologia: varias bases, varios nodos, varios R2</text><text x="30" y="62" font-size="13" fill="#6b7280">Cada nodo respalda los proyectos que tiene configurados; el respaldo de cada proyecto y dia queda completo en TODOS los R2.</text><text x="145" y="98" font-size="12" font-weight="700" fill="#c74634" text-anchor="middle">BASES ORACLE</text><text x="490" y="98" font-size="12" font-weight="700" fill="#7c3aed" text-anchor="middle">NODOS (VM, en cualquier nube)</text><text x="1025" y="98" font-size="12" font-weight="700" fill="#f38020" text-anchor="middle">BUCKETS R2 (cuentas distintas)</text><g class="caja" data-t="Oracle ADB · tienda"><rect x="30" y="110" width="230" height="100" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/><rect x="30" y="110" width="230" height="6" rx="3" fill="#c74634"/><text x="44" y="138" font-size="14" font-weight="700" fill="#c74634">Oracle ADB · tienda</text><text x="44" y="160" font-size="12.5" fill="#1f2937">esquema TIENDA_DEMO</text><text x="44" y="179" font-size="12.5" fill="#1f2937">wallet mTLS · solo SELECT</text></g><g class="caja" data-t="Oracle ADB · inventario"><rect x="30" y="240" width="230" height="100" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/><rect x="30" y="240" width="230" height="6" rx="3" fill="#c74634"/><text x="44" y="268" font-size="14" font-weight="700" fill="#c74634">Oracle ADB · inventario</text><text x="44" y="290" font-size="12.5" fill="#1f2937">esquema INVENTARIO_DEMO</text><text x="44" y="309" font-size="12.5" fill="#1f2937">wallet mTLS · solo SELECT</text></g><g class="caja" data-t="Oracle ADB · facturas"><rect x="30" y="370" width="230" height="100" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/><rect x="30" y="370" width="230" height="6" rx="3" fill="#c74634"/><text x="44" y="398" font-size="14" font-weight="700" fill="#c74634">Oracle ADB · facturas</text><text x="44" y="420" font-size="12.5" fill="#1f2937">esquema FACTURAS_DEMO</text><text x="44" y="