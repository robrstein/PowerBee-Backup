<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 548" width="1280" height="548" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Coordinacion de nodos con Cloudflare R2"><title>Coordinacion de nodos con Cloudflare R2</title><defs><marker id="m-0f766e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/></marker><marker id="m-6b7280" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="m-15803d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker><marker id="m-c74634" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c74634"/></marker><marker id="m-0891b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0891b2"/></marker><marker id="m-4f46e5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/></marker><marker id="m-f38020" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f38020"/></marker><marker id="m-7c3aed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker><marker id="m-475569" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1280" height="548" rx="16" fill="#f8fafc" stroke="#d1d5db"/><text x="30" y="40" font-size="20" font-weight="700" fill="#1f2937">Coordinacion de varios nodos con R2</text><text x="30" y="62" font-size="13" fill="#6b7280">Cada VM corre el timer; solo una gana la reserva del dia y sube. Las demas dejan su copia local.</text><g class="caja" data-t="vm-a"><rect x="30" y="110" width="300" height="110" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="30" y="110" width="300" height="6" rx="3" fill="#7c3aed"/><text x="44" y="138" font-size="15" font-weight="700" fill="#7c3aed">vm-a</text><text x="44" y="160" font-size="12.5" fill="#1f2937">systemd timer (cada 6 h)</text><text x="44" y="179" font-size="12.5" fill="#1f2937">pbdbbackup.py --una-por-dia</text><text x="44" y="198" font-size="12.5" fill="#1f2937">gana la reserva → extrae → sube → _hecho.json</text></g><path id="n-db-vm-a" d="M330,165 C420,165 420,165 500,165" fill="none" stroke="#c74634" stroke-width="2" marker-end="url(#m-c74634)"/><g class="caja" data-t="vm-b"><rect x="30" y="260" width="300" height="110" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="30" y="260" width="300" height="6" rx="3" fill="#7c3aed"/><text x="44" y="288" font-size="15" font-weight="700" fill="#7c3aed">vm-b</text><text x="44" y="310" font-size="12.5" fill="#1f2937">systemd timer (cada 6 h)</text><text x="44" y="329" font-size="12.5" fill="#1f2937">pbdbbackup.py --una-por-dia</text><text x="44" y="348" font-size="12.5" fill="#1f2937">reserva ocupada (412) → solo copia local</text></g><path id="n-db-vm-b" d="M330,315 C420,315 420,315 500,315" fill="none" stroke="#c74634" stroke-width="2" marker-end="url(#m-c74634)"/><g class="caja" data-t="vm-c"><rect x="30" y="410" width="300" height="110" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="30" y="410" width="300" height="6" rx="3" fill="#7c3aed"/><text x="44" y="438" font-size="15" font-weight="700" fill="#7c3aed">vm-c</text><text x="44" y="460" font-size="12.5" fill="#1f2937">systemd timer (cada 6 h)</text><text x="44" y="479" font-size="12.5" fill="#1f2937">pbdbbackup.py --una-por-dia</text><text x="44" y="498" font-size="12.5" fill="#1f2937">ya hay _hecho.json → nada / copia local</text></g><g class="caja" data-t="Oracle ADB"><rect x="500" y="150" width="210" height="300" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/><rect x="500" y="150" width="210" height="6" rx="3" fill="#c74634"/><text x="514" y="178" font-size="15" font-weight="700" fill="#c74634">Oracle ADB</text><text x="514" y="200" font-size="12.5" fill="#1f2937">esquema(s) del proyecto</text><text x="514" y="219" font-size="12.5" fill="#1f2937"></text><text x="514" y="238" font-size="12.5" fill="#1f2937">solo SELECT</text><text x="514" y="257" font-size="12.5" fill="#1f2937"></text><text x="514" y="276" font-size="12.5" fill="#1f2937">lectura consistente</text><text x="514" y="295" font-size="12.5" fill="#1f2937">(READ ONLY)</text></g><g class="caja" data-t="Cloudflare R2 · bucket"><rect x="830" y="100" width="420" height="420" rx="10" fill="#fff" stroke="#f38020" stroke-width="2"/><rect x="830" y="100" width="420" height="6" rx="3" fill="#f38020"/><text x="844" y="128" font-size="15" font-weight="700" fill="#f38020">Cloudflare R2 · bucket</text></g><text data-l="0" x="850" y="150" font-size="13" fill="#1f2937" font-family="Consolas, monospace" xml:space="preserve">proyecto/</text><text data-l="1" x="850" y="176" font-size="13" fill="#1f2937" font-family="Consolas, monospace" xml:space="preserve">  2026-11-20/</text><text data-l="2" x="850" y="202" font-size="13" fill="#1f2937" font-family="Consolas, monospace" xml:space="preserve">    proyecto_esquema_..._030512.zip</text><text data-l="3" x="850" y="228" font-size="13" fill="#15803d" font-family="Consolas, monospace" xml:space="preserve">    _hecho.json</text><text data-l="4" x="850" y="254" font-size="13" fill="#1f2937" font-family="Consolas, monospace" xml:space="preserve">  2026-11-21/</text><text data-l="5" x="850" y="280" font-size="13" fill="#f38020" font-family="Consolas, monospace" xml:space="preserve">    _reserva.json   ← vm-a</text><text data-l="6" x="850" y="306" font-size="13" fill="#1f2937" font-family="Consolas, monospace" xml:space="preserve">    proyecto_esquema_..._030744.zip</text><text data-l="7" x="850" y="332" font-size="13" fill="#15803d" font-family="Consolas, monospace" xml:space="preserve">    _hecho.json</text><text x="850" y="380" font-size="12" fill="#6b7280">PUT If-None-Match: *  → solo un nodo crea la reserva</text><text x="850" y="400" font-size="12" fill="#6b7280">reserva vencida (&gt; 6 h) → se reemplaza con If-Match</text><text x="850" y="420" font-size="12" fill="#6b7280">falla → se borra la reserva y otro nodo reintenta</text><text x="850" y="440" font-size="12" fill="#6b7280">retencion: lifecycle rules del bucket</text><path id="n-r2-a" d="M710,200 C770,200 770,190 828,190" fill="none" stroke="#f38020" stroke-width="2" marker-end="url(#m-f38020)"/><text x="770" y="222" font-size="11.5" fill="#6b7280" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">sube</text><path id="n-res-a" d="M330,140 C580,40 700,90 828,150" fill="none" stroke="#f38020" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m-f38020)"/><text x="560" y="80" font-size="11.5" fill="#6b7280" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">vm-a: reserva OK</text><path id="n-res-b" d="M330,290 C390,290 380,505 600,505 C780,505 770,330 828,330" fill="none" stroke="#f38020" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m-f38020)"/><text x="600" y="527" font-size="11.5" fill="#c74634" text-anchor="middle" paint-order="stroke" stroke="#fff" stroke-width="4">vm-b: reserva ocupada (412 Precondition Failed)</text><g opacity="0"><circle r="6" fill="#15803d" stroke="#fff" stroke-width="2"/><text font-size="10" font-weight="700" fill="#15803d" x="9" y="-8">PUT</text><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#n-res-a"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#c74634" stroke="#fff" stroke-width="2"/><text font-size="10" font-weight="700" fill="#c74634" x="9" y="-8">412</text><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#n-res-b"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#c74634" stroke="#fff" stroke-width="2"/><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#n-db-vm-a"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="1.6s" begin="1.0s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#c74634" stroke="#fff" stroke-width="2"/><animateMotion dur="1.6s" begin="1.4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#n-db-vm-b"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="1.6s" begin="1.4s" repeatCount="indefinite"/></g><g opacity="0"><circle r="6" fill="#f38020" stroke="#fff" stroke-width="2"/><text font-size="10" font-weight="700" fill="#f38020" x="9" y="-8">zip</text><animateMotion dur="1.6s" begin="2.0s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear"><mpath href="#n-r2-a"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="1.6s" begin="2.0s" repeatCount="indefinite"/></g></svg>
