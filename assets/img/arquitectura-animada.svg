ura</text><text x="30" y="62" font-size="13" fill="#6b7280">Respaldo logico de esquemas Oracle a scripts SQL restaurables, con visor web y copia en Cloudflare R2</text><g class="caja" data-t="Ejecucion programada"><rect x="330" y="84" width="360" height="64" rx="10" fill="#fff" stroke="#7c3aed" stroke-width="2"/><rect x="330" y="84" width="360" height="6" rx="3" fill="#7c3aed"/><text x="344" y="112" font-size="14" font-weight="700" fill="#7c3aed">Ejecucion programada</text><text x="344" y="134" font-size="12.5" fill="#1f2937">systemd timer en 1..N VM  ·  --una-por-dia</text></g><g class="caja" data-t="Oracle Autonomous DB"><rect x="30" y="190" width="230" height="250" rx="10" fill="#fff" stroke="#c74634" stroke-width="2"/><rect x="30" y="190" width="230" height="6" rx="3" fill="#c74634"/><text x="44" y="218" font-size="15" font-weight="700" fill="#c74634">Oracle Autonomous DB</text><text x="44" y="240" font-size="12.5" fill="#1f2937">Esquema origen</text><text x="44" y="259" font-size="12.5" fill="#1f2937"></text><text x="44" y="278" font-size="12.5" fill="#1f2937">tablas · indices · FK</text><text x="44" y="297" font-size="12.5" fill="#1f2937">paquetes · vistas · tipos</text><text x="44" y="316" font-size="12.5" fill="#1f2937">triggers · secuencias</text><text x="44" y="335" font-size="12.5" fill="#1f2937">jobs · grants · sinonimos</text><text x="44" y="354" font-size="12.5" fill="#1f2937"></text><text x="44" y="373" font-size="12.5" fill="#1f2937">Diccionario ALL_*</text><text x="44" y="392" font-size="12.5" fill="#1f2937">DBMS_METADATA</text></g><text x="44" y="430" font-size="11" fill="#6b7280">wallet mTLS · thin o thick</text><g class="caja" data-t="pbdbbackup.py"><rect x="330" y="180" width="360" height="330" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><rect x="330" y="180" width="360" height="6" rx="3" fill="#4f46e5"/><text x="344" y="208" font-size="15" font-weight="700" fill="#4f46e5">pbdbbackup.py</text></g><g class="paso" data-n="1"><rect x="346" y="222" width="328" height="38" rx="7" fill="#fff" stroke="#c7d2fe"/><circle cx="366" cy="241" r="11" fill="#4f46e5"/><text x="366" y="245.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="386" y="238" font-size="12.5" font-weight="700" fill="#1f2937">Conexion</text><text x="386" y="253" font-size="11" fill="#6b7280">.env / appsettings · perfiles por proyecto</text></g><g class="paso" data-n="2"><rect x="346" y="268" width="328" height="38" rx="7" fill="#fff" stroke="#c7d2fe"/><circle cx="366" cy="287" r="11" fill="#4f46e5"/><text x="366" y="291.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="386" y="284" font-size="12.5" font-weight="700" fill="#1f2937">Estructura</text><text x="386" y="299" font-size="11" fill="#6b7280">DBMS_METADATA → DDL ordenado por dependencias</text></g><g class="paso" data-n="3"><rect x="346" y="314" width="328" height="38" rx="7" fill="#fff" stroke="#c7d2fe"/><circle cx="366" cy="333" r="11" fill="#4f46e5"/><text x="366" y="337.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text><text x="386" y="330" font-size="12.5" font-weight="700" fill="#1f2937">Instantanea</text><text x="386" y="345" font-size="11" fill="#6b7280">SET TRANSACTION READ ONLY (mismo SCN)</text></g><g class="paso" data-n="4"><rect x="346" y="360" width="328" height="38" rx="7" fill="#fff" stroke="#c7d2fe"/><circle cx="366" cy="379" r="11" fill="#4f46e5"/><text x="366" y="383.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="386" y="376" font-size="12.5" font-weight="700" fill="#1f2937">Orden</text><text x="386" y="391" font-size="11" fill="#6b7280">topologico por FK · ciclos detectados</text></g><g class="paso" data-n="5"><rect x="346" y="406" width="328" height="38" rx="7" fill="#fff" stroke="#c7d2fe"/><circle cx="366" cy="425" r="11" fill="#4f46e5"/><text x="366" y="429.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text><text x="386" y="422" font-size="12.5" font-weight="700" fill="#1f2937">Generadores</text><text x="386" y="437" font-size="11" fill="#6b7280">tables · pkg · views · data · otros</text></g><g class="paso" data-n="6"><rect x="346" y="452" width="328" height="38" rx="7" fill="#fff" stroke="#c7d2fe"/><circle cx="366" cy="471" r="11" fill="#4f46e5"/><text x="366" y="475.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">6</text><text x="386" y="468" font-size="12.5" font-weight="700" fill="#1f2937">Visor</text><text x="386" y="483" font-size="11" fill="#6b7280">manifest.json + filas jsonl.gz</text></g><g class="caja" data-t="respaldo .zip"><rect x="760" y="180" width="190" height="330" rx="10" fill="#fff" stroke="#475569" stroke-width="2"/><rect x="760" y="180" width="190" height="6" rx="3" fill="#475569"/><text x="774" y="208" font-size="15" font-weight="700" fill="#475569">respaldo .zip</text></g><g class="art" data-a="_tables.sql"><rect x="776" y="222" width="158" height="26" rx="5" fill="#fff" stroke="#d1d5db"/><rect x="776" y="222" width="4" height="26" fill="#475569"/><text x="788" y="239.5" font-size="11.5" fill="#1f2937" font-family="Consolas, monospace">_tables.sql</text></g><g class="art" data-a="_pkg.sql"><rect x="776" y="256" width="158" height="26" rx="5" fill="#fff" stroke="#d1d5db"/><rect x="776" y="256" width="4" height="26" fill="#475569"/><text x="788" y="273.5" font-size="11.5" fill="#1f2937" font-family="Consolas, monospace">_pkg.sql</text></g><g class="art" data-a="_views.sql"><rect x="776" y="290" width="158" height="26" rx="5" fill="#fff" stroke="#d1d5db"/><rect x="776" y="290" width="4" height="26" fill="#475569"/><text x="788" y="307.5" font-size="11.5" fill="#1f2937" font-family="Consolas, monospace">_views.sql</text></g><g class="art" data-a="_data.sql"><rect x="776" y="324" width="158" height="26" rx="5" fill="#fff" stroke="#d1d5db"/><rect x="776" y="324" width="4" height="26" fill="#475569"/><text x="788" y="341